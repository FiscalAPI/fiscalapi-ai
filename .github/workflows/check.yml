name: Check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin (skills, commands and manifests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Skill frontmatter and documentation links
        run: node scripts/check-skills.mts

      - name: Claude Code, Codex and Copilot manifests
        run: npx -y @anthropic-ai/claude-code@2.1.293 plugin validate . --strict

      - name: Cursor manifest matches the Claude Code manifest
        run: cmp .claude-plugin/plugin.json .cursor-plugin/plugin.json

  docs-mcp:
    name: Docs MCP server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-mcp/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Generate data from the public sources
        run: npm run build:data

      - name: Verify package contents
        run: npm run verify:package
