name: Check

# En cada PR y cada lunes: las docs cambian aunque este repo no, y un enlace roto deja a una skill sin su fuente.
on:
  pull_request:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Frontmatter y enlaces de las skills
        run: node scripts/check-skills.mjs

      - name: Manifiestos de Claude Code, Codex y Copilot
        run: npx -y @anthropic-ai/claude-code@2.1.293 plugin validate . --strict

      # Cursor no lee .claude-plugin: su manifiesto es una copia exacta del de Claude Code.
      - name: Manifiesto de Cursor
        run: cmp .claude-plugin/plugin.json .cursor-plugin/plugin.json
